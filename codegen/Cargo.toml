[package]
name = "codegen"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["watch"]
watch = ["dep:notify", "dep:rtrb"]

[dependencies]
glob = "0.3"
minijinja = { version = "2.14", features = ["loader"] }
notify = { version = "8.2", optional = true }
rtrb = { path = "..", optional = true }
toml = "1.1"
